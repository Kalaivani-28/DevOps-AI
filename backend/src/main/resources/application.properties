server.port=8080
spring.application.name=ai-devops-incident-analyzer
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devopsai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devops}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devops}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
jwt.secret=${JWT_SECRET:change-this-secret-key-for-production}
